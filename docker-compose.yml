version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: SandraXAndreiaDB
    hostname: postgres
    restart: always
    environment:
      POSTGRES_DB: SandraXAndreiaDB
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d SandraXAndreiaDB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      app_net:
        aliases:
          - postgres

  pgadmin:
    image: dpage/pgadmin4:9
    container_name: usuario-pgadmin
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - app_net

  app:
    build: .
    container_name: sandra-x-andreia
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/SandraXAndreiaDB
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET com pelo menos 32 caracteres}
      JWT_EXPIRATION_SECONDS: ${JWT_EXPIRATION_SECONDS:-3600}
    ports:
      - "8080:8080"
    networks:
      - app_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sandra-x-andreia-frontend
    restart: always
    depends_on:
      - app
    ports:
      - "5173:80"
    networks:
      - app_net

volumes:
  postgres_data:
  pgadmin_data:

networks:
  app_net:
    driver: bridge
