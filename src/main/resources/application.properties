spring.application.name=Sandra-X-Andreia

spring.profiles.active=${SPRING_PROFILES_ACTIVE:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.thymeleaf.cache=false

springdoc.swagger-ui.path=/swagger-ui.html

security.jwt.secret=${JWT_SECRET}
security.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}
security.jwt.cookie-secure=${JWT_COOKIE_SECURE:true}
security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:5500,http://127.0.0.1:5500,http://localhost:3000,http://127.0.0.1:3000}

