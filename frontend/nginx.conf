server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # O frontend nao possui etapa de build com nomes de arquivos versionados.
    # Evita que um novo container reutilize JS/HTML de uma versao anterior.
    location ~* \.(?:html|js|css)$ {
        try_files $uri =404;
        etag off;
        if_modified_since off;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
    }
}
