<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoramento - Curador</title>
    <link rel="stylesheet" href="/global.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            line-height: 1.6;
            color: #333;
            background-color: #f8fafc;
        }

        /* Main Content */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 2rem;
        }
        /* KPIs */
        .kpis {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 2rem;
            margin-bottom: 4rem;
        }
        .kpi-card {
            background: white;
            padding: 2rem;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            text-align: center;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .kpi-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
        }
        .kpi-number {
            font-size: 3rem;
            font-weight: 700;
            color: #3b82f6;
            margin-bottom: 0.5rem;
        }
        .kpi-label {
            font-size: 1.1rem;
            color: #64748b;
            font-weight: 500;
        }
        /* Graphs Section */
        .graphs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            margin-bottom: 4rem;
        }
        .graph-card {
            background: white;
            padding: 2rem;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }
        .graph-card h3 {
            margin-bottom: 1.5rem;
            color: #1e293b;
            font-size: 1.3rem;
            font-weight: 600;
        }
        .monitoring-placeholder {
            color: #64748b;
        }
        /* Table */
        .table-section {
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            overflow: hidden;
            margin-bottom: 4rem;
        }
        .table-header {
            background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
            color: white;
            padding: 1.5rem 2rem;
            font-size: 1.3rem;
            font-weight: 600;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 1.2rem 2rem;
            text-align: left;
            border-bottom: 1px solid #f1f5f9;
        }
        th {
            background: #f8fafc;
            font-weight: 600;
            color: #475569;
        }
        tr:hover {
            background: #f1f5f9;
        }
        /* Responsive */
        @media (max-width: 768px) {
            .graphs {
                grid-template-columns: 1fr;
            }
            .header h1 {
                font-size: 2rem;
            }
            .nav-links {
                display: none;
            }
            .kpis {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <input type="checkbox" class="nav-toggle" id="nav-toggle">
        <div class="nav-left">
            <label for="nav-toggle" class="nav-toggle-label">
                <span></span>
                <span></span>
                <span></span>
            </label>
            <a href="dashboard.html" class="logo">EdTech</a>
        </div>
        <ul class="menu">
            <li><a href="catalogo.html">Catálogo de Cursos</a></li>
        </ul>
        <div class="nav-right">

            <a href="#"><div class="avatar">JD</div></a>
        </div>
    </nav>

    <!-- Header -->
    <header class="header">
        <h1>Monitoramento</h1>
    </header>

    <main class="container">
        <!-- KPIs -->
        <section class="kpis" aria-busy="true" aria-label="Carregando indicadores">
            <div class="kpi-card">
                <div class="kpi-number">--</div>
                <div class="kpi-label">Cursos ativos</div>
            </div>
            <div class="kpi-card">
                <div class="kpi-number">--</div>
                <div class="kpi-label">Professores</div>
            </div>
            <div class="kpi-card">
                <div class="kpi-number">--</div>
                <div class="kpi-label">Alunos</div>
            </div>
            <div class="kpi-card">
                <div class="kpi-number">--</div>
                <div class="kpi-label">Matrículas</div>
            </div>
        </section>

        <!-- SVGs fictícios removidos: curador.js substitui estes placeholders por resumos com dados reais. -->
        <section class="graphs" aria-busy="true" aria-label="Carregando resumos do monitoramento">
            <div class="graph-card">
                <h3>Cursos por status</h3>
                <p class="monitoring-placeholder">Carregando dados reais...</p>
            </div>
            <div class="graph-card">
                <h3>Matrículas</h3>
                <p class="monitoring-placeholder">Carregando dados reais...</p>
            </div>
        </section>

        <!-- Table -->
        <section class="table-section" aria-busy="true" aria-label="Carregando matrículas">
            <div class="table-header">Matrículas</div>
            <table>
                <thead>
                    <tr>
                        <th>Curso</th>
                        <th>Aluno</th>
                        <th>Status</th>
                        <th>Data</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td colspan="4" class="monitoring-placeholder">Carregando dados reais...</td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>
    <script src="../config.js"></script>
    <script src="../session.js"></script>
    <script src="curador.js"></script>
</body>
</html>
