<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Cursos</title>
    <link rel="stylesheet" href="../global.css">
    <link rel="stylesheet" href="../aluno/style/catalogo.css">
</head>
<body>
    <!-- Navbar -->
    <header class="header">
        <nav class="navbar">
            <input type="checkbox" class="nav-toggle" id="nav-toggle">
            <div class="nav-left">
            <label for="nav-toggle" class="nav-toggle-label">
                <span></span>
                <span></span>
                <span></span>
            </label>
            <a href="dashboard.html" class="logo">EdTech</a>
            </div>
            <ul class="menu">
                <li><a href="catalogo.html">Catálogo de Cursos</a></li>
            </ul>
            <div class="nav-right">
            
            <a href="#"><div class="avatar">JD</div></a>
            </div>
        </nav>  
    </header>

    <!-- Header -->
    <header class="page-header">
        <h1>Catálogo de Cursos</h1>
    </header>

    <!-- Filters -->
    <div class="filters" aria-labelledby="curator-filters-status">
        <button class="filter-pill" type="button" disabled aria-disabled="true" aria-describedby="curator-filters-status" title="Filtros do catálogo em breve">Todos</button>
        <button class="filter-pill" type="button" disabled aria-disabled="true" aria-describedby="curator-filters-status" title="Filtros do catálogo em breve">Recomendados</button>
        <button class="filter-pill" type="button" disabled aria-disabled="true" aria-describedby="curator-filters-status" title="Filtros do catálogo em breve">Front-end</button>
        <button class="filter-pill" type="button" disabled aria-disabled="true" aria-describedby="curator-filters-status" title="Filtros do catálogo em breve">Back-end</button>
        <button class="filter-pill" type="button" disabled aria-disabled="true" aria-describedby="curator-filters-status" title="Filtros do catálogo em breve">Data Science</button>
        <button class="filter-pill" type="button" disabled aria-disabled="true" aria-describedby="curator-filters-status" title="Filtros do catálogo em breve">Soft Skills</button>
        <p id="curator-filters-status" class="filters-status">Filtros do catálogo em breve.</p>
    </div>

    <!-- Courses Grid -->
    <div class="courses-grid" aria-busy="true" aria-label="Carregando cursos">
        <div class="course-skeleton" aria-hidden="true">
            <div class="skeleton-block skeleton-thumb"></div>
            <div class="skeleton-block skeleton-title"></div>
            <div class="skeleton-block skeleton-text"></div>
            <div class="skeleton-block skeleton-badge"></div>
        </div>
        <div class="course-skeleton" aria-hidden="true">
            <div class="skeleton-block skeleton-thumb"></div>
            <div class="skeleton-block skeleton-title"></div>
            <div class="skeleton-block skeleton-text"></div>
            <div class="skeleton-block skeleton-badge"></div>
        </div>
        <div class="course-skeleton" aria-hidden="true">
            <div class="skeleton-block skeleton-thumb"></div>
            <div class="skeleton-block skeleton-title"></div>
            <div class="skeleton-block skeleton-text"></div>
            <div class="skeleton-block skeleton-badge"></div>
        </div>
        <div class="course-skeleton" aria-hidden="true">
            <div class="skeleton-block skeleton-thumb"></div>
            <div class="skeleton-block skeleton-title"></div>
            <div class="skeleton-block skeleton-text"></div>
            <div class="skeleton-block skeleton-badge"></div>
        </div>
    </div>
    <script src="../config.js"></script>
    <script src="../session.js"></script>
    <script src="curador.js"></script>
</body>
</html>
