<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard do Professor - EdTech</title>
    <link rel="stylesheet" href="/global.css">
    <link rel="stylesheet" href="style/dashboard.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>

    </style>
</head>
<body>
    <nav class="navbar">
        <input type="checkbox" class="nav-toggle" id="nav-toggle">
        <div class="nav-left">
        <label for="nav-toggle" class="nav-toggle-label">
            <span></span>
            <span></span>
            <span></span>
        </label>
        <a href="dashboard.html" class="logo">EdTech</a>
        </div>
        <ul class="menu">
            <li><a href="agenda.html">Agenda</a></li>
        </ul>
        <div class="nav-right">
        <div class="avatar loading-skeleton loading-skeleton-avatar" aria-label="Carregando perfil"></div>
        </div>
    </nav>

    <header>
        <div class="container">
            <h1>Olá, <span data-field="nomeProfessor" class="loading-skeleton loading-skeleton-text" aria-label="Carregando nome"></span></h1>
        </div>
    </header>

    <section class="section">
        <div class="container">
            <h2>Cadastrar Novo Curso</h2>
            <form id="courseForm" class="card course-form">
                <label>
                    Nome do curso
                    <input type="text" id="course-nome" required placeholder="Ex: Java para Iniciantes">
                </label>
                <label>
                    Tipo de assinatura
                    <select id="course-tipoAssinatura" required>
                        <option value="COMUM">Comum</option>
                        <option value="PREMIUM">Premium</option>
                    </select>
                </label>
                <label>
                    Tipo de curso
                    <select id="course-tipoCurso" required>
                        <option value="SINCRONO">Sincrono</option>
                        <option value="ASSINCRONO">Assincrono</option>
                        <option value="AMBOS">Ambos</option>
                    </select>
                </label>
                <button type="submit" class="btn course-submit">Enviar para avaliacao</button>
                <p id="course-feedback" aria-live="polite"></p>
            </form>
        </div>
    </section>

    <section class="section">
        <div class="container">
            <h2>Métricas Principais</h2>
            <div class="kpi-grid" aria-busy="true" aria-label="Carregando métricas">
                <div class="card kpi-card">
                    <div class="icon" aria-hidden="true">✅</div>
                    <div class="value loading-skeleton loading-skeleton-text" aria-hidden="true"></div>
                    <div class="label">Cursos aprovados</div>
                </div>
                <div class="card kpi-card">
                    <div class="icon" aria-hidden="true">⏳</div>
                    <div class="value loading-skeleton loading-skeleton-text" aria-hidden="true"></div>
                    <div class="label">Cursos em avaliação</div>
                </div>
                <div class="card kpi-card">
                    <div class="icon" aria-hidden="true">👥</div>
                    <div class="value loading-skeleton loading-skeleton-text" aria-hidden="true"></div>
                    <div class="label">Matrículas recebidas</div>
                </div>
                <div class="card kpi-card">
                    <div class="icon" aria-hidden="true">📚</div>
                    <div class="value loading-skeleton loading-skeleton-text" aria-hidden="true"></div>
                    <div class="label">Cursos cadastrados</div>
                </div>
            </div>
        </div>
    </section>

    <section class="section">
        <div class="container">
            <div class="charts-grid" aria-busy="true" aria-label="Carregando indicadores reais">
                <div class="card chart-card loading-skeleton loading-skeleton-card" aria-hidden="true"></div>
                <div class="card chart-card loading-skeleton loading-skeleton-card" aria-hidden="true"></div>
            </div>
        </div>
    </section>

    <section class="section">
        <div class="container">
            <h2>Cursos cadastrados</h2>
            <div class="activities-grid" aria-busy="true" aria-label="Carregando cursos cadastrados">
                <div class="card activity-card loading-skeleton loading-skeleton-card" aria-hidden="true"></div>
                <div class="card activity-card loading-skeleton loading-skeleton-card" aria-hidden="true"></div>
                <div class="card activity-card loading-skeleton loading-skeleton-card" aria-hidden="true"></div>
            </div>
        </div>
    </section>
    <script src="../config.js"></script>
    <script src="../session.js"></script>
    <script src="../dashboard-ui.js"></script>
    <script src="professor.js"></script>
</body>
</html>
