<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda do Professor - EdTech</title>    
    <link rel="stylesheet" href="/global.css">
    <link rel="stylesheet" href="style/agenda.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <input type="checkbox" class="nav-toggle" id="nav-toggle">
        <div class="nav-left">
        <label for="nav-toggle" class="nav-toggle-label">
            <span></span>
            <span></span>
            <span></span>
        </label>
        <a href="dashboard.html" class="logo">EdTech</a>
        </div>
        <ul class="menu">
            <li><a href="agenda.html">Agenda</a></li>
        </ul>
        <div class="nav-right">
        <button type="button" class="logout-btn" aria-label="Encerrar sessão">Sair</button>
        <a href="#"><div class="avatar">JD</div></a>
        </div>
    </nav>  

    <!-- Header -->
    <header>
        <div class="header-content">
            <h1>Sua agenda</h1>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-container">
        <!-- Calendar Section -->
        <section class="calendar-section" aria-busy="true" aria-label="Carregando calendário">
            <div class="month-nav">
                <button class="nav-btn" type="button" data-month-direction="-1" aria-label="Mês anterior" disabled>&larr;</button>
                <h2 class="month-title">Carregando mês atual...</h2>
                <button class="nav-btn" type="button" data-month-direction="1" aria-label="Próximo mês" disabled>&rarr;</button>
            </div>
            <div class="calendar-header">
                <span class="day-header">Dom</span>
                <span class="day-header">Seg</span>
                <span class="day-header">Ter</span>
                <span class="day-header">Qua</span>
                <span class="day-header">Qui</span>
                <span class="day-header">Sex</span>
                <span class="day-header">Sáb</span>
            </div>
            <div class="calendar-grid">
                <p class="calendar-loading">Carregando calendário atual...</p>
            </div>
        </section>

        <!-- Events Section -->
        <section class="events-section" aria-busy="true" aria-label="Carregando cursos do professor">
            <h3>Cursos vinculados</h3>
            <p class="agenda-notice">O sistema ainda não possui datas de aulas ou eventos para associar aos dias do calendário.</p>
            <div class="events-list">
                <p class="events-loading">Carregando cursos reais...</p>
            </div>
        </section>
    </main>
    <script src="../config.js"></script>
    <script src="../session.js"></script>
    <script src="professor.js"></script>
</body>
</html>
