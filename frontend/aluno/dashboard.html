<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard do Aluno</title>
    <link rel="stylesheet" href="../global.css">
    <link rel="stylesheet" href="style/dashboard.css">
</head>

<body>
    <header class="header">
        <nav class="navbar">
            <input type="checkbox" class="nav-toggle" id="nav-toggle">
            <div class="nav-left">
                <label for="nav-toggle" class="nav-toggle-label">
                    <span></span>
                    <span></span>
                    <span></span>
                </label>
                <a href="dashboard.html" class="logo">EdTech</a>
            </div>
            <ul class="menu">
                <li><a href="conquistas.html">Conquistas</a></li>
                <li><a href="forum.html">Fórum</a></li>
            </ul>
            <div class="nav-right">
                <div class="avatar loading-skeleton loading-skeleton-avatar" aria-label="Carregando perfil"></div>
            </div>
        </nav>
    </header>

    <main>
        <section class="greeting">
            <h1>Olá, <span data-field="nomeAluno" class="loading-skeleton loading-skeleton-text" aria-label="Carregando nome"></span>!</h1>
            <button class="btn-pill btn-primary" type="button" disabled aria-disabled="true" title="Alteração de plano em breve">Mudar Plano</button>
        </section>

        <section class="top-cards">
            <div class="card gamificacao" aria-busy="true" aria-label="Carregando gamificação">
                <h3>Gamificação</h3>
                <div class="points-display">
                    <span class="points-current loading-skeleton loading-skeleton-text" aria-hidden="true"></span>
                    <span class="points-total loading-skeleton loading-skeleton-text" aria-hidden="true"></span>
                </div>
                <div class="achievements">
                    <span class="badge loading-skeleton loading-skeleton-chip" aria-hidden="true"></span>
                    <span class="badge loading-skeleton loading-skeleton-chip" aria-hidden="true"></span>
                </div>
            </div>
            <div class="card cursos-disponiveis" aria-busy="true" aria-label="Carregando cursos disponíveis">
                <h3>Cursos disponíveis</h3>
                <ul class="bonus-list" data-dashboard-course-list>
                    <li><span class="loading-skeleton loading-skeleton-text" aria-hidden="true"></span></li>
                    <li><span class="loading-skeleton loading-skeleton-text" aria-hidden="true"></span></li>
                    <li><span class="loading-skeleton loading-skeleton-text" aria-hidden="true"></span></li>
                </ul>
            </div>
        </section>

        <section class="section-andamento">
            <h2>Cursos em Andamento</h2>
            <div class="cards-grid" data-student-progress aria-busy="true" aria-label="Carregando cursos em andamento">
                <div class="card loading-skeleton loading-skeleton-card" aria-hidden="true"></div>
                <div class="card loading-skeleton loading-skeleton-card" aria-hidden="true"></div>
            </div>
        </section>

        <section class="section-catalogo">
            <h2>Catálogo de Cursos</h2>
            <div class="filtros">
                <button class="filtro active">Todos</button>
                <button class="filtro">Em Andamento</button>
                <button class="filtro">Recomendados</button>
                <button class="filtro">Front-end</button>
                <button class="filtro">Back-end</button>
            </div>
            <div class="cards-grid" data-approved-courses data-limit="6" aria-busy="true" aria-label="Carregando cursos aprovados">
                <div class="card loading-skeleton loading-skeleton-card" aria-hidden="true"></div>
                <div class="card loading-skeleton loading-skeleton-card" aria-hidden="true"></div>
            </div>
            <div class="saber-mais">
                <a href="catalogo.html"><button class="btn-pill btn-primary">Ver mais</button></a>
            </div>
        </section>
    </main>
    <script src="../config.js"></script>
    <script src="../session.js"></script>
    <script src="aluno.js"></script>
</body>

</html>
