<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus Certificados</title>
    <link rel="stylesheet" href="../global.css">
    <link rel="stylesheet" href="style/certificado.css">
</head>
<body>
    <header class="header">
        <nav class="navbar">
            <input type="checkbox" class="nav-toggle" id="nav-toggle">
            <div class="nav-left">
                <label for="nav-toggle" class="nav-toggle-label">
                    <span></span>
                    <span></span>
                    <span></span>
                </label>
                <a href="dashboard.html" class="logo">EdTech</a>
            </div>
            <ul class="menu">
                <li><a href="conquistas.html">Conquistas</a></li>
            </ul>
            <div class="nav-right">
                <div class="avatar loading-skeleton loading-skeleton-avatar" aria-label="Carregando perfil"></div>
            </div>
        </nav>
    </header>

    <main class="container">
        <div class="top-bar">
            <h1>Meus Certificados</h1>
        </div>

        <div class="stats-section" id="statsSection" aria-busy="true" aria-label="Carregando estatísticas dos certificados">
            <div class="stat-card">
                <div class="stat-number loading-skeleton loading-skeleton-text" id="totalCursos" aria-hidden="true"></div>
                <div class="stat-label">Cursos Concluidos</div>
            </div>
            <div class="stat-card">
                <div class="stat-number loading-skeleton loading-skeleton-text" id="totalHoras" aria-hidden="true"></div>
                <div class="stat-label">Horas de Aprendizado</div>
            </div>
            <div class="stat-card">
                <div class="stat-number loading-skeleton loading-skeleton-text" id="mediaGeral" aria-hidden="true"></div>
                <div class="stat-label">Media Geral</div>
            </div>
        </div>

        <div class="filtros-section" aria-labelledby="certificate-filter-status">
            <button class="filtro-btn ativo" type="button" disabled aria-disabled="true" aria-describedby="certificate-filter-status" title="Filtros de certificados em breve">Todos</button>
            <p id="certificate-filter-status" class="unavailable-hint">Filtros de certificados em breve.</p>
        </div>

        <div id="certificadosContainer" class="certificados-grid">
            <p class="empty-state">Carregando certificados...</p>
        </div>
    </main>

    <div id="modalCompartilhar" class="modal">
        <div class="modal-content">
            <div class="modal-header">Compartilhar Certificado</div>
            <div class="modal-body" id="modalCompartilharBody">
                O LinkedIn será aberto em uma nova aba para você continuar o compartilhamento do certificado.
            </div>
            <div class="modal-footer">
                <button class="btn-cancel" type="button" data-close-certificate-modal>Cancelar</button>
                <button class="btn-confirm" type="button" data-confirm-certificate-share>Compartilhar</button>
            </div>
        </div>
    </div>

    <script src="../config.js"></script>
    <script src="../session.js"></script>
    <script src="../dashboard-ui.js"></script>
    <script src="aluno.js"></script>
</body>
</html>
