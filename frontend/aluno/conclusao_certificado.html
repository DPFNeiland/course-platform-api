<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Certificado de Conclusao</title>
    <link rel="stylesheet" href="../global.css">
    <link rel="stylesheet" href="style/conclusao_certificado.css">
</head>
<body>
    <header class="header">
        <nav class="navbar">
            <input type="checkbox" class="nav-toggle" id="nav-toggle">
            <div class="nav-left">
                <label for="nav-toggle" class="nav-toggle-label">
                    <span></span>
                    <span></span>
                    <span></span>
                </label>
                <a href="dashboard.html" class="logo">EdTech</a>
            </div>
            <ul class="menu">
                <li><a href="conquistas.html">Conquistas</a></li>
            </ul>
            <div class="nav-right">
                <div class="avatar loading-skeleton loading-skeleton-avatar" aria-label="Carregando perfil"></div>
            </div>
        </nav>
    </header>

    <main class="container">
        <section class="certificado-section">
            <div class="certificado-preview">
                <div class="certificado-title">Certificado de Conclusao</div>
                <div class="certificado-text">Certificamos que</div>
                <div class="certificado-nome loading-skeleton loading-skeleton-text" id="certificadoNome" aria-hidden="true"></div>
                <div class="certificado-text">concluiu com exito o curso de</div>
                <div class="certificado-curso loading-skeleton loading-skeleton-text" id="certificadoCurso" aria-hidden="true"></div>
                <div class="certificado-info">
                    <div class="certificado-info-item">
                        <span class="certificado-info-label">Carga Horaria</span>
                        <span id="certificadoCargaHoraria" class="loading-skeleton loading-skeleton-text" aria-hidden="true"></span>
                    </div>
                    <div class="certificado-info-item">
                        <span class="certificado-info-label">Data de Emissao</span>
                        <span id="certificadoData" class="loading-skeleton loading-skeleton-text" aria-hidden="true"></span>
                    </div>
                </div>
            </div>
        </section>

        <section class="acoes-section">
            <a href="certificado.html" class="btn-primary">Voltar para certificados</a>
            <a href="catalogo.html" class="btn-tertiary">Ver catalogo</a>
        </section>
    </main>

    <script src="../config.js"></script>
    <script src="../session.js"></script>
    <script src="../dashboard-ui.js"></script>
    <script src="aluno.js"></script>
</body>
</html>
